name: Build Test

on:
  pull_request:

jobs:
  detekt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          # Temurin 25 は jmods を同梱しておらず ProGuard が JDK クラスを参照できないため、jmods 同梱の Zulu を使う
          distribution: 'zulu'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Detekt
        run: ./gradlew detekt --auto-correct
  build-test:
    if: ${{ ! failure() }}
    needs: detekt-check
    strategy:
      matrix:
        os: [ 'ubuntu-latest', 'windows-latest' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          # Temurin 25 は jmods を同梱しておらず ProGuard が JDK クラスを参照できないため、jmods 同梱の Zulu を使う
          distribution: 'zulu'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Unit Test
        run: ./gradlew composeApp:desktopTest
      - name: Build with Gradle
        run: ./gradlew composeApp:packageReleaseDistributionForCurrentOS
