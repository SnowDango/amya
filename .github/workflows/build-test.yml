name: Build Test

on:
  pull_request:

jobs:
  detekt-check:
    runs-on: ubuntu-latest
    env:
      # detekt 1.23.x は JDK 25 上で起動できないため、detekt のみ JDK 21 で実行する。
      # (env 経由にして Renovate の java-jdk 更新対象から外している)
      DETEKT_JAVA_VERSION: '21'
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK for detekt
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.DETEKT_JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Detekt
        run: ./gradlew detekt --auto-correct
  build-test:
    if: ${{ ! failure() }}
    needs: detekt-check
    strategy:
      matrix:
        os: [ 'ubuntu-latest', 'windows-latest' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Unit Test
        run: ./gradlew composeApp:desktopTest
      - name: Build with Gradle
        run: ./gradlew composeApp:packageReleaseDistributionForCurrentOS
