name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: 'Release tag (e.g., v1.0.0)'

permissions:
  contents: write
  discussions: write

jobs:
  detekt-check:
    runs-on: ubuntu-latest
    env:
      # detekt 1.23.x は JDK 25 上で起動できないため、detekt のみ JDK 21 で実行する。
      # (env 経由にして Renovate の java-jdk 更新対象から外している)
      DETEKT_JAVA_VERSION: '21'
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK for detekt
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.DETEKT_JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Detekt
        run: ./gradlew detekt --auto-correct
  windows-build:
    if: ${{ ! failure() }}
    needs: detekt-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          # Temurin 25 は jmods を同梱しておらず ProGuard が JDK クラスを参照できないため、jmods 同梱の Zulu を使う
          distribution: 'zulu'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: BuildKonfig Parameter
        run: Add-Content -Path gradle.properties -Value "buildkonfig.flavor=release"
      - name: Build with Gradle
        run: ./gradlew composeApp:packageReleaseMsi
      - name: Make release directory
        run: mkdir -p release
      - name: Move Linux package to release directory
        run: mv composeApp/build/customOutputDir/main-release/msi/**.msi release/
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: release/**.msi
  linux-build:
    if: ${{ ! failure() }}
    needs: detekt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          # Temurin 25 は jmods を同梱しておらず ProGuard が JDK クラスを参照できないため、jmods 同梱の Zulu を使う
          distribution: 'zulu'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: BuildKonfig Parameter
        run: echo "buildkonfig.flavor=release" >> gradle.properties
      - name: Build with Gradle
        run: ./gradlew composeApp:packageReleaseDeb
      - name: Make release directory
        run: mkdir -p release
      - name: Move Linux package to release directory
        run: mv composeApp/build/customOutputDir/main-release/deb/**.deb release/
      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: linux-package
          path: release/**.deb
  create-release:
    if: ${{ ! failure() }}
    needs:
      - linux-build
      - windows-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: ./release
      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: linux-package
          path: ./release
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.event.inputs.tag }}
          body: ${{ github.event.inputs.tag }}
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            release/**.msi
            release/**.deb
          make_latest: true
          generate_release_notes: true
